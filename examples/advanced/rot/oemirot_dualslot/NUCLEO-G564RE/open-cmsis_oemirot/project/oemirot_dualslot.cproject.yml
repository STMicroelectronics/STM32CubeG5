# yaml-language-server: $schema=https://raw.githubusercontent.com/Open-CMSIS-Pack/devtools/schemas/projmgr/2.11.0/tools/projmgr/schemas/cproject.schema.json
project:
  processor:
    trustzone: secure-only
    dsp: on
    fpu: off
  rte:
    base-dir: $SolutionDir()$/../oemirot/user_modifiable
  generators:
    base-dir: generated
  output:
    base-name: ../../../bin/oemirot
    type:
    - elf
    - bin
    - hex
  setups:
  - setup: release_AC6
    misc:
    - ASM:
      - -Oz
      - -g
      C:
      - -Oz
      - -std=gnu11
      - -fno-exceptions
      - -fno-rtti
      - -funsigned-char
      - -g
      - -Wmissing-prototypes
      CPP:
      - -Oz
      - -std=gnu++14
      - -fno-exceptions
      - -fno-rtti
      - -funsigned-char
      - -g
      - -Wmissing-prototypes
      for-compiler: AC6
      Link-C:
      - --map
      - --library_type=microlib
      - --symbols
      - --show_full_path
      - --inline
      - --any_contingency
      - --scatter=../../../oemirot/user_modifiable/Device/STM32G564RET3/stm32g564xe_flash.sct
      Link-CPP:
      - --map
      - --library_type=microlib
      - --symbols
      - --show_full_path
      - --inline
      - --any_contingency
    for-context:
    - .release_AC6
  components:
  - component: STMicroelectronics::CMSIS:CORE@6.2.0
  - component: STMicroelectronics::Device:STM32 HAL:CORTEX@2.0.0
  - component: STMicroelectronics::Device:STM32 HAL:Core@2.0.0
  - component: STMicroelectronics::Device:STM32 HAL:DMA@2.0.0
  - component: STMicroelectronics::Device:STM32 HAL:FLASH@2.0.0
  - component: STMicroelectronics::Device:STM32 HAL:FLASH_ITF@2.0.0
  - component: STMicroelectronics::Device:STM32 HAL:GPIO@2.0.0
  - component: STMicroelectronics::Device:STM32 HAL:HASH@2.0.0
  - component: STMicroelectronics::Device:STM32 HAL:ICACHE@2.0.0
  - component: STMicroelectronics::Device:STM32 HAL:PWR@2.0.0
  - component: STMicroelectronics::Device:STM32 HAL:Q@2.0.0
  - component: STMicroelectronics::Device:STM32 HAL:RAMCFG@2.0.0
  - component: STMicroelectronics::Device:STM32 HAL:RCC@2.0.0
  - component: STMicroelectronics::Device:STM32 HAL:RNG@2.0.0
  - component: STMicroelectronics::Device:STM32 HAL:SBS@2.0.0
  - component: STMicroelectronics::Device:STM32 HAL:TAMP@2.0.0
  - component: STMicroelectronics::Device:STM32 HAL:UART@2.0.0
  - component: STMicroelectronics::Device:STM32 LL:BUS@2.0.0
  - component: STMicroelectronics::Device:STM32 LL:Common@2.0.0
  - component: STMicroelectronics::Device:STM32 LL:DMA@2.0.0
  - component: STMicroelectronics::Device:STM32 LL:EXTI@2.0.0
  - component: STMicroelectronics::Device:STM32 LL:FLASH@2.0.0
  - component: STMicroelectronics::Device:STM32 LL:GPIO@2.0.0
  - component: STMicroelectronics::Device:STM32 LL:ICACHE@2.0.0
  - component: STMicroelectronics::Device:STM32 LL:PWR@2.0.0
  - component: STMicroelectronics::Device:STM32 LL:RAMCFG@2.0.0
  - component: STMicroelectronics::Device:STM32 LL:RCC@2.0.0
  - component: STMicroelectronics::Device:STM32 LL:RNG@2.0.0
  - component: STMicroelectronics::Device:STM32 LL:SBS@2.0.0
  - component: STMicroelectronics::Device:STM32 LL:TAMP@2.0.0
  - component: STMicroelectronics::Device:STM32 LL:USART@2.0.0
  - component: STMicroelectronics::Device:STM32 LL:UTILS@2.0.0
  - component: STMicroelectronics::Device:STM32CubeMX2 Codegen:Generated Code@2.0.0
  - component: STMicroelectronics::Device:STM32CubeMX2 Config:CORE@2.0.0
  - component: STMicroelectronics::Device:STM32CubeMX2 Config:CORTEX NVIC@2.0.0
  - component: STMicroelectronics::Device:STM32CubeMX2 Config:FLASH@2.0.0
  - component: STMicroelectronics::Device:STM32CubeMX2 Config:HASH@2.0.0
  - component: STMicroelectronics::Device:STM32CubeMX2 Config:ICACHE@2.0.0
  - component: STMicroelectronics::Device:STM32CubeMX2 Config:RAMCFG@2.0.0
  - component: STMicroelectronics::Device:STM32CubeMX2 Config:RCC@2.0.0
  - component: STMicroelectronics::Device:STM32CubeMX2 Config:RNG@2.0.0
  - component: STMicroelectronics::Device:STM32CubeMX2 Config:SBS@2.0.0
  - component: STMicroelectronics::Device:STM32CubeMX2 Config:System@2.0.0
  - component: STMicroelectronics::Device:STM32CubeMX2 Config:TAMP@2.0.0
  - component: STMicroelectronics::Device:STM32CubeMX2 Config:UART@2.0.0
  - component: STMicroelectronics::Device:Startup@2.0.0
  - component: STMicroelectronics::Security:MCUboot:Core@1.0.2
  - component: STMicroelectronics::Security:MCUboot:Platform Common@1.0.1
  - component: STMicroelectronics::Security:MbedTLS:Core@3.6.6
  - component: STMicroelectronics::Security:MbedTLS:MBED API@3.6.6
  - component: STMicroelectronics::Security:MbedTLS:PSA API@3.6.6
  - component: STMicroelectronics::Security:MbedTLS:SW Crypto@3.6.6
  - component: STMicroelectronics::Security:RoT_Provisioning:Core@1.1.0
  - component: STMicroelectronics::Security:STCryptoLib:CMOX API@5.0.0
  - component: STMicroelectronics::Security:STCryptoLib:Core@5.0.0
  - component: STMicroelectronics::Security:STFCF:PSA API@1.0.0
  - component: STMicroelectronics::Security:STM32CubeMX2 Config:STCryptoLib@1.1.0
  - component: STMicroelectronics::Security:STM32CubeMX2 Config:STFCF@1.1.0
  - component: STMicroelectronics::Utility:Basic stdio:Core@1.1.0
  - component: STMicroelectronics::Utility:Basic stdio:itf_io&UART@1.1.0
  - component: STMicroelectronics::Utility:STM32CubeMX2 Config:Basic stdio@1.0.0
  - component: STMicroelectronics::Utility:STM32CubeMX2 Config:syscalls@1.0.0
  - component: STMicroelectronics::Utility:syscalls&Standalone syscalls@1.0.0
  - component: STMicroelectronics::Utility:sysmem&Standalone sysmem@1.0.0
  define:
  - USE_TRACE: 0
  executes:
  - execute: prebuild
    run: python ./../../../oemirot/project_oemirot.py prebuild --compiler $Compiler$
    always:
    for-context:
    - .release_AC6
  groups:
  - group: oemirot
    files:
    - file: ../../oemirot/user_modifiable/Device/STM32G564RET3/system_stm32g5xx.c
      category: source
    - file: $SolutionDir()$/../oemirot/boot_pre_include_global.h
      category: preIncludeGlobal
    - file: ../../oemirot/boot_hal_hash_ref.c
      category: source
    - file: ../../oemirot/boot_hal.c
      category: source
    - file: ../../oemirot/boot_nv_counters.c
      category: source
    - file: ../../oemirot/keys_map.c
      category: source
    - file: ../../oemirot/low_level_device.c
      category: source
    - file: ../../oemirot/low_level_flash.c
      category: source
    - file: ../../oemirot/low_level_rng.c
      category: source
    - file: ../../oemirot/low_level_security.c
      category: source
    - file: ../../oemirot/tick.c
      category: source
    - file: ../../oemirot/low_level_obkeys_device.c
      category: source
    - file: ../../oemirot/low_level_obkeys.c
      category: source
    - file: ../../oemirot/boot_hal_cfg.h
      category: header
    - file: ../../oemirot/boot_hal_flowcontrol.h
      category: header
    - file: ../../oemirot/boot_hal_hash_ref.h
      category: header
    - file: ../../oemirot/boot_hal_imagevalid.h
      category: header
    - file: ../../oemirot/boot_hal_legacy.h
      category: header
    - file: ../../oemirot/boot_hal_utils.h
      category: header
    - file: ../../oemirot/cmsis.h
      category: header
    - file: ../../oemirot/flash_layout.h
      category: header
    - file: ../../oemirot/low_level_flash.h
      category: header
    - file: ../../oemirot/low_level_rng.h
      category: header
    - file: ../../oemirot/low_level_security.h
      category: header
    - file: ../../oemirot/region_defs.h
      category: header
    - file: ../../oemirot/mcuboot_config.h
      category: header
    - file: ../../oemirot/low_level_security_config.h
      category: header
    - file: ../../oemirot/low_level_obkeys.h
      category: header
