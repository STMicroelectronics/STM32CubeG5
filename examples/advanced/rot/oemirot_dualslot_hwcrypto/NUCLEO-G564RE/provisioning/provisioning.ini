[provisioning]
path = ./../../../../../../utilities/rot_provisioning/
example_json_path = ./config/example.json
tools_bin_env_name = STM32_PRG_PATH
memory_config_ini_path = ./config/mx_memory_config.ini

[appli_config]
appli_ini_path = ./../appli/project_appli.ini

[appli_data_image]
provisioning_xml_path = ./xml/appli/appli_data_provisioning_image.xml
fwu_xml_path = ./xml/appli/appli_data_fwu_image.xml

[oemirot_config]
installation_mode = overwrite
oemirot_ini_path = ./../oemirot/project_oemirot.ini
keys_xml_path = ./xml/oemirot/oemirot_keys_config.xml
data_bin_path = ./obk/oemirot_data.obk

[da]
type = password
min_product_state = OPEN
final_product_state = OPEN

[da_certificates]
config_xml_path = ./da/da_config_certificate.xml
certificate = ./da/da_cert.b64

[da_password]
config_xml_path = ./da/da_config_password.xml
