@startuml
title Timing diagram of the PLAY signals

binary "PLAYi_INx"    as IN0
clock  "SW Trigger 0" as IN1 with period 2000
binary "XOR output"   as OUT


@0
IN0 is low
OUT is high

@500
IN0 is high
OUT is low

@1000
OUT is high

@1500
IN0 is low
OUT is low

@2000
IN0 is low
OUT is high

@3000
OUT is low

@3500
IN0 is high
OUT is high

@4000
OUT is low

@enduml

