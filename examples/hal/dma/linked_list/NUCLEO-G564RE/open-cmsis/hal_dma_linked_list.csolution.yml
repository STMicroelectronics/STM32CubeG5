# yaml-language-server: $schema=https://raw.githubusercontent.com/Open-CMSIS-Pack/devtools/schemas/projmgr/2.11.0/tools/projmgr/schemas/csolution.schema.json
solution:
  target-types:
    - type: NUCLEO-G564RE
      device: STM32G564RET6
  output-dirs:
    tmpdir: build/tmp
    outdir: $SolutionDir()$/build/$Project$.$BuildType$
  generators:
    base-dir: $ProjectDir()$/generated
    options:
      - generator: stm32g5xx_hal_mx2codegen
        path: ../generated/hal
      - generator: led_mx2codegen
        path: ../generated/parts/led
  build-types:
    - type: release_AC6
      compiler: AC6
    - type: release_IAR
      compiler: IAR
    - type: release_GCC
      compiler: GCC
    - type: debug_GCC
      compiler: GCC
  packs:
    - pack: STMicroelectronics::CMSIS
      path: ../../../../../../arch/cmsis
    - pack: STMicroelectronics::led_part_drivers
      path: ../../../../../../part_drivers/led
    - pack: STMicroelectronics::stm32g5xx_dfp
      path: ../../../../../../stm32g5xx_dfp
    - pack: STMicroelectronics::stm32g5xx_hal_drivers
      path: ../../../../../../stm32g5xx_drivers
    - pack: STMicroelectronics::syscalls
      path: ../../../../../../utilities/syscalls
  projects:
    - project: project/hal_dma_linked_list.cproject.yml
