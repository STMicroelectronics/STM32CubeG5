<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="490" height="266" viewBox="0 0 490 266" role="img" aria-labelledby="title desc">
  <title id="title">STM32 GPIO EXTI and IDD ammeter setup</title>
  <desc id="desc">STM32 MCU with GPIO EXTI line and IDD connected to an ammeter.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="3" dy="3" stdDeviation="2" flood-color="#777" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="490" height="266" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#000">
    <rect x="45" y="35" width="210" height="196" rx="6" fill="#fff" stroke="#000" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="123" y="62" width="165" height="74" rx="7" fill="#4db5e4" stroke="#000" stroke-width="2" filter="url(#shadow)"/>
    <text x="205.5" y="82" text-anchor="middle" font-size="14" font-weight="700">GPIO</text>
    <text x="205.5" y="106" text-anchor="middle" font-size="14" font-weight="700">EXTI line</text>
    <line x1="288" y1="105" x2="375" y2="105" stroke="#000" stroke-width="1"/>
    <rect x="123" y="148" width="165" height="58" rx="7" fill="#fff" stroke="#000" stroke-width="2" filter="url(#shadow)"/>
    <text x="153" y="182" font-size="14" font-weight="700">IDD</text>
    <line x1="288" y1="162" x2="315" y2="162" stroke="#000" stroke-width="1"/>
    <line x1="288" y1="186" x2="325" y2="186" stroke="#000" stroke-width="1"/>
    <rect x="325" y="148" width="140" height="57" rx="6" fill="#fff" stroke="#000" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="395" y="182" text-anchor="middle" font-size="14" font-weight="700">Ammeter</text>
    <text x="150" y="221" text-anchor="middle" font-size="14" font-weight="700">STM32 MCU</text>
  </g>
</svg>
