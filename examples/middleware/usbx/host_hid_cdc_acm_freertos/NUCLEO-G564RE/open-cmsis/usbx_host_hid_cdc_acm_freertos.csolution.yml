# yaml-language-server: $schema=https://raw.githubusercontent.com/Open-CMSIS-Pack/devtools/schemas/projmgr/2.11.0/tools/projmgr/schemas/csolution.schema.json
solution:
  target-types:
    - type: NUCLEO-G564RE
      device: STM32G564RET3
  output-dirs:
    tmpdir: build/tmp
    outdir: $SolutionDir()$/build/$Project$.$BuildType$
  generators:
    base-dir: $ProjectDir()$/generated
    options:
      - generator: stm32g5xx_hal_mx2codegen
        path: $SolutionDir()$/../generated/hal/
      - generator: syscalls_mx2codegen
        path: $SolutionDir()$/../generated/utilities/syscalls
      - generator: led_mx2codegen
        path: $SolutionDir()$/../generated/parts/led
      - generator: freertos_mx2codegen
        path: $SolutionDir()$/../generated/middleware/freertos
      - generator: usbx_mx2codegen
        path: $SolutionDir()$/../generated/middleware/usbx
      - generator: advanced_trace_mx2codegen
        path: $SolutionDir()$/../generated/utilities/advanced_trace
  build-types:
    - type: release_AC6
      compiler: AC6
  packs:
    - pack: STMicroelectronics::CMSIS
      path: ../../../../../../arch/cmsis
    - pack: STMicroelectronics::advanced_trace
      path: ../../../../../../utilities/advanced_trace
    - pack: STMicroelectronics::freertos
      path: ../../../../../../middleware/freertos
    - pack: STMicroelectronics::led_part_drivers
      path: ../../../../../../part_drivers/led
    - pack: STMicroelectronics::stm32g5xx_dfp
      path: ../../../../../../stm32g5xx_dfp
    - pack: STMicroelectronics::stm32g5xx_hal_drivers
      path: ../../../../../../stm32g5xx_drivers
    - pack: STMicroelectronics::syscalls
      path: ../../../../../../utilities/syscalls
    - pack: STMicroelectronics::usbx
      path: ../../../../../../middleware/usbx
  projects:
    - project: project/usbx_host_hid_cdc_acm_freertos.cproject.yml
